
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masuk - Ngojek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans antialiased h-screen w-screen overflow-hidden m-0 p-0 flex items-center justify-center">

    <div class="w-full max-w-md h-full md:h-[90vh] md:max-h-[850px] bg-white md:rounded-3xl shadow-2xl flex flex-col justify-between overflow-hidden relative border border-slate-100">
        <div class="flex-1 flex flex-col justify-between overflow-y-auto px-6 py-8 custom-scrollbar bg-white">
            <div>
                <div class="flex items-center justify-between mb-8 pb-3 border-b border-slate-100">
                    <div class="flex items-center space-x-3">
                        <img src="logo.png" alt="Ngojek Logo" class="w-10 h-10 object-contain rounded-xl shadow-md border border-blue-100 bg-blue-50" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'45\' fill=\'%232563eb\'/><text x=\'50\' y=\'55\' font-size=\'35\' fill=\'white\' text-anchor=\'middle\' font-weight=\'bold\'>YD</text></svg>'">
                        <div>
                            <span class="text-xl font-black tracking-tight text-slate-900">Your<span class="text-blue-600">Driver</span></span>
                            <p class="text-[9px] font-bold uppercase tracking-widest text-slate-400">Enterprise Logistics & Ride</p>
                        </div>
                    </div>
                    <span class="text-[10px] bg-blue-50 text-blue-700 px-3 py-1 rounded-full font-bold uppercase tracking-wider border border-blue-100">Masuk</span>
                </div>

                <div class="mb-6">
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight">Selamat Datang Kembali! 👋</h1>
                    <p class="text-xs text-slate-500 mt-1">Masuk untuk melanjutkan perjalanan dan memesan layanan.</p>
                </div>

                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div class="space-y-1.5">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 px-1">Email Terdaftar</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-envelope text-xs"></i></div>
                            <input type="email" id="login-identifier" autocomplete="email" placeholder="nama@email.com" required
                                class="w-full pl-10 pr-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:outline-none focus:border-blue-600 focus:bg-white transition">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 px-1">Kata Sandi</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-lock text-xs"></i></div>
                            <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••" required
                                class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:outline-none focus:border-blue-600 focus:bg-white transition">
                            <button type="button" onclick="togglePassword('login-password', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
                                <i class="fa-solid fa-eye text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <button id="login-submit" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 transition flex items-center justify-center space-x-2 text-xs md:text-sm tracking-wide mt-2">
                        <span>Masuk ke Aplikasi</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>

                <div class="my-5 flex items-center gap-3 text-[10px] text-slate-400">
                    <span class="h-px flex-1 bg-slate-200"></span><span>atau lanjutkan dengan</span><span class="h-px flex-1 bg-slate-200"></span>
                </div>
                <div class="space-y-2">
                    <button type="button" onclick="socialLogin('google')" class="w-full flex items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white py-3 text-xs font-bold text-slate-700 hover:bg-slate-50 transition"><i class="fa-brands fa-google"></i> Login dengan Google</button>
                    <button type="button" onclick="socialLogin('facebook')" class="w-full flex items-center justify-center gap-2 rounded-xl bg-blue-600 py-3 text-xs font-bold text-white hover:bg-blue-700 transition"><i class="fa-brands fa-facebook-f"></i> Login dengan Facebook</button>
                    <button type="button" onclick="socialLogin('instagram')" class="w-full flex items-center justify-center gap-2 rounded-xl py-3 text-xs font-bold text-white transition hover:opacity-90" style="background:linear-gradient(105deg,#833ab4 0%,#e1306c 48%,#fc8b2d 100%)"><i class="fa-brands fa-instagram"></i> Login dengan Instagram</button>
                </div>
                <p class="mt-2 text-center text-[9px] leading-relaxed text-slate-400">Login sosial memerlukan konfigurasi OAuth pada Supabase dan penyedia terkait.</p>
            </div>

            <div class="pt-6 text-center border-t border-slate-100 mt-6">
                <p class="text-xs text-slate-500">Belum punya akun? <a href="register.html" class="font-bold text-blue-600 hover:underline">Daftar Sekarang</a></p>
                <p class="text-[10px] text-slate-400 font-semibold mt-3">Ngojek System © 2026</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="yd-config.js"></script>
    <script>
        const loginClient = window.ydSupabase;

        function togglePassword(fieldId, btn) {
            const input = document.getElementById(fieldId);
            const icon = btn.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash text-xs';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye text-xs';
            }
        }

        function setCustomerSession(user) {
            const name =
                user.user_metadata?.full_name ||
                user.user_metadata?.name ||
                user.email ||
                'Pelanggan';

            // Untuk kompatibilitas dengan dashboard lama.
            // Tidak menyimpan kata sandi.
            localStorage.setItem('yd_logged_in_user', name);
        }

        async function handleLogin(e) {
            e.preventDefault();

            if (!loginClient) {
                alert('Supabase belum siap. Periksa yd-config.js dan koneksi internet.');
                return;
            }

            const button = document.getElementById('login-submit');
            const email = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value;

            button.disabled = true;
            button.querySelector('span').textContent = 'Memeriksa akun...';

            try {
                const { data, error } = await loginClient.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;
                if (!data.user) throw new Error('Data pengguna tidak ditemukan.');

                setCustomerSession(data.user);

                alert('Selamat datang kembali!');
                window.location.replace('index.html');
            } catch (error) {
                console.error('Login error:', error);
                alert('Login gagal: ' + (error.message || 'Periksa email dan kata sandi.'));
            } finally {
                button.disabled = false;
                button.querySelector('span').textContent = 'Masuk ke Aplikasi';
            }
        }

        async function socialLogin(provider) {
            if (provider === 'instagram') {
                alert('Login Instagram memerlukan integrasi OAuth khusus. Gunakan Google atau Facebook untuk sementara.');
                return;
            }

            if (!loginClient) {
                alert('Supabase belum siap. Periksa yd-config.js.');
                return;
            }

            try {
                const redirectTo = new URL('login.html', window.location.href).href;

                const { error } = await loginClient.auth.signInWithOAuth({
                    provider,
                    options: { redirectTo }
                });

                if (error) throw error;
            } catch (error) {
                console.error('OAuth error:', error);
                alert('Login sosial gagal: ' + (error.message || 'Periksa konfigurasi OAuth.'));
            }
        }

        // Menangani sesi OAuth setelah pengguna kembali ke login.html.
        // Sesi yang sudah ada juga tidak perlu login berulang kali.
        (async function restoreCustomerSession() {
            if (!loginClient) return;

            try {
                const { data, error } = await loginClient.auth.getSession();
                if (error) throw error;

                const user = data.session?.user;
                if (user) {
                    setCustomerSession(user);
                    window.location.replace('index.html');
                }
            } catch (error) {
                console.error('Pemeriksaan sesi gagal:', error);
            }
        })();
    </script>
</body>
</html>
