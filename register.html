<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Akun Baru - YourDriver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans antialiased h-screen w-screen overflow-hidden m-0 p-0 flex items-center justify-center">

    <div class="w-full max-w-md h-full md:h-[90vh] md:max-h-[850px] bg-white md:rounded-3xl shadow-2xl flex flex-col justify-between overflow-hidden relative border border-slate-100">
        <div class="flex-1 flex flex-col justify-between overflow-y-auto px-6 py-8 custom-scrollbar bg-white">
            <div>
                <!-- Brand & Logo -->
                <div class="flex items-center justify-between mb-6 pb-3 border-b border-slate-100">
                    <div class="flex items-center space-x-3">
                        <img src="logo.png" alt="YourDriver Logo" class="w-10 h-10 object-contain rounded-xl shadow-md border border-blue-100 bg-blue-50" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'45\' fill=\'%232563eb\'/><text x=\'50\' y=\'55\' font-size=\'35\' fill=\'white\' text-anchor=\'middle\' font-weight=\'bold\'>YD</text></svg>'">
                        <div>
                            <span class="text-xl font-black tracking-tight text-slate-900">Your<span class="text-blue-600">Driver</span></span>
                            <p class="text-[9px] font-bold uppercase tracking-widest text-slate-400">Enterprise Logistics & Ride</p>
                        </div>
                    </div>
                    <span class="text-[10px] bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full font-bold uppercase tracking-wider border border-emerald-100">Daftar</span>
                </div>

                <div class="mb-5">
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight">Buat Akun Baru ✨</h1>
                    <p class="text-xs text-slate-500 mt-1">Bergabunglah dan nikmati kemudahan transportasi & logistik.</p>
                </div>

                <!-- Form Register -->
                <form id="register-form" onsubmit="handleRegister(event)" class="space-y-3.5">
                    <div class="space-y-1">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 px-1">Nama Lengkap</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-user text-xs"></i></div>
                            <input type="text" id="reg-name" placeholder="Masukkan nama lengkap" required
                                class="w-full pl-10 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:outline-none focus:border-blue-600 focus:bg-white transition">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 px-1">Email / Username Pengenal</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-envelope text-xs"></i></div>
                            <input type="text" id="reg-email" placeholder="nama@email.com atau username" required
                                class="w-full pl-10 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:outline-none focus:border-blue-600 focus:bg-white transition">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 px-1">Kata Sandi</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-lock text-xs"></i></div>
                            <input type="password" id="reg-password" placeholder="Minimal 6 karakter" required minlength="6"
                                class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:outline-none focus:border-blue-600 focus:bg-white transition">
                            <button type="button" onclick="togglePassword('reg-password', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
                                <i class="fa-solid fa-eye text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 transition flex items-center justify-center space-x-2 text-xs md:text-sm tracking-wide mt-2">
                        <span>Daftar Sekarang</span>
                        <i class="fa-solid fa-user-plus text-xs"></i>
                    </button>
                </form>
            </div>

            <div class="pt-6 text-center border-t border-slate-100 mt-6">
                <p class="text-xs text-slate-500">Sudah punya akun? <a href="login.html" class="font-bold text-blue-600 hover:underline">Masuk di sini</a></p>
                <p class="text-[10px] text-slate-400 font-semibold mt-3">YourDriver System © 2026</p>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(fieldId, btn) {
            const input = document.getElementById(fieldId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash text-xs';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye text-xs';
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            const userData = { name, email, password };
            localStorage.setItem('yd_registered_user', JSON.stringify(userData));

            alert(`Pendaftaran berhasil, ${name}! Silakan masuk menggunakan akun Anda.`);
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
